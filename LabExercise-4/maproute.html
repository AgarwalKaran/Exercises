<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>

        var map = L.map('map').setView([12.936449671251983, 77.60627301037235], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        
        L.Routing.control({
            waypoints: [
                L.latLng(12.936449671251983, 77.60627301037235), // Starting point
                L.latLng(12.931097443280379, 77.60614638585506)    // Ending point
            ],
            routeWhileDragging: true
        }).addTo(map);

        var startMarker = L.marker([12.936449671251983, 77.60627301037235]).addTo(map);
        startMarker.bindPopup("<b>Christ University - Front Gate</b>").openPopup();

        var endMarker = L.marker([12.931097443280379, 77.60614638585506]).addTo(map);
        endMarker.bindPopup("<b>Christ University - Back Gate</b>");
    </script>
</body>
</html>
